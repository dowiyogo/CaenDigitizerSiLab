# VX1740 via A4818, external NIM trigger on TRG-IN
model 1740
connectionType 2
linkNum 62578
conetNode 0
vmeBaseAddress 0x00000000

# These are kept for baseline/channel config, but not used as trigger source
polarization 0
vthreshold -100

# 625 samples * 16 ns = 10 us acquisition window
acqsamples 625
nevents 1000000
bunches 1
ptriggersize 60

# Channel trigger polarity is not the external NIM trigger polarity,
# but keep falling edge for consistency with negative signals
triggerpolaritymode 0

# Timeout in seconds. 1209600 s = 14 days, enough for low trigger rates.
timeout 1209600

# EXT trigger
triggerSource 9
