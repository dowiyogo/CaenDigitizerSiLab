# VX1740 diagnostic self-trigger for hod2019 only
# Ch0-CH31  = hod2018
# Ch32-CH63 = hod2019
# Diagnostic use only: trigger must come only from hod2019 channels.

model 1740
connectionType 2
linkNum 62578
conetNode 0
vmeBaseAddress 0x00000000

# Keep the same negative-signal convention used in the existing setup.
polarization 0
triggerpolaritymode 0

# Conservative threshold for a first diagnostic pass. Adjust upward/downward if needed.
vthreshold -80

# Acquisition window similar to the existing VX1740 configs.
acqsamples 1024
ptriggersize 60

# Short diagnostic run: 1-3 minutes is the target.
nevents 5000
bunches 1
timeout 180

# Self-trigger mode for the VX1740.
# triggerSource 8 keeps the x740 self-trigger path enabled in this codebase.
triggerSource 8

# Only enable groups 4-7 => CH32-CH63 (hod2019) for trigger generation.
triggerGroupMask 0xF0
