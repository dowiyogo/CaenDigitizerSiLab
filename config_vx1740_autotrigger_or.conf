# VX1740 self-trigger: any channel crossing -100 mV, OR logic
model 1740
connectionType 2
linkNum 62578
conetNode 0
vmeBaseAddress 0x00000000

# 2 Vpp range centered at 0 V
polarization 0

# Negative threshold in mV; falling-edge trigger below -100 mV
vthreshold -100
triggerpolaritymode 0

# Acquisition window
acqsamples 1024
ptriggersize 60

# Acquisition size and timeout
nevents 60000
bunches 1
timeout 240000

# 8 = all VX1740 groups/channels in OR self-trigger
triggerSource 8
