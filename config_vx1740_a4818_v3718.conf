# Digitizer model: 5724, 5730, 5740, 1740
model 1740

# Connection type:
# 4 = A4818_V3718
connectionType 4

# For A4818, linkNum is the A4818 PID
linkNum 62578

# Board position in CONET daisy chain. First board = 0
conetNode 0

# Usually 0 for direct optical/CONET access unless using VME bridge/base addressing
vmeBaseAddress 0x00000000

# Polarization type
polarization 0

# Voltage Threshold (mV)
vthreshold -20

# Samples per acquisition
acqsamples 10000

# Events per bunch
nevents 1000

# Bunches per measurement
bunches 1

# Post trigger size (%)
ptriggersize 60

# Trigger polarity mode: Rising edge = 1 ; Falling edge = 0
triggerpolaritymode 0

# Timeout in seconds
timeout 600

# Trigger source: EXT=9 recommended for first hardware test
triggerSource 9
